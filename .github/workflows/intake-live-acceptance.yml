name: Isolated intake runtime acceptance
on:
  pull_request:
    paths:
      - 'scripts/intake-live-acceptance.mjs'
      - '.github/workflows/intake-live-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-intake-acceptance
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'b2bconsult4u-FLH/fltract' && github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise frozen candidate using preview D1 and no email binding
        run: node scripts/intake-live-acceptance.mjs
