name: Public release preflight
on:
  push:
    branches: [fix/intake-validation-current-main-2026-10-17]
    paths:
      - scripts/public-release-preflight.mjs
      - .github/workflows/public-release-preflight.yml
  pull_request:
    paths:
      - '**/*.html'
      - assets/**
      - scripts/public-release-preflight.mjs
      - .github/workflows/public-release-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check candidate public pages and launch hold
        run: node scripts/public-release-preflight.mjs
      - name: Check current production pages and internal file exclusions (read only)
        run: node scripts/public-release-preflight.mjs --live
