name: Public release preflight
on:
  push:
    branches: [fix/intake-validation-current-main-2026-10-17]
    paths:
      - scripts/public-release-preflight.mjs
      - .github/workflows/public-release-preflight.yml
  pull_request:
    paths:
      - '**/*.html'
      - assets/**
      - scripts/public-release-preflight.mjs
      - .github/workflows/public-release-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-preflight:
    name: Candidate public source preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check candidate public pages and enabled intake
        run: node scripts/public-release-preflight.mjs --intake-enabled
  production-preflight:
    name: Current production HTTP preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check owner-only production access restriction (no protected content inspection)
        run: node scripts/public-release-preflight.mjs --live --expect-access
