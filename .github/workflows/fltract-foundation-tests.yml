name: FLTract Foundation Tests
on:
  push:
    branches:
      - integration/property-records-current-main-2026-10-10
  pull_request:
    paths:
      - 'modules/property-records/**'
      - 'workers/intake/**'
      - 'workers/admin/**'
      - 'contact/**'
      - '.github/workflows/fltract-foundation-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check admin Worker syntax
        run: node --check workers/admin/worker.mjs
      - name: Run manager recovery access acceptance tests
        run: node --test modules/property-records/tests/group1-manager-access.test.mjs
      - name: Run autonomous recovery tests (isolated, no production writes)
        run: node --test modules/property-records/tests/milestone-c-recovery.test.mjs
      - name: Run property-record and intake-contract tests
        run: node --test modules/property-records/tests/*.test.mjs
