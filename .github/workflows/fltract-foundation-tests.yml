name: FLTract Foundation Tests
on:
  push:
    branches:
      - integration/property-records-current-main-2026-10-10
  pull_request:
    paths:
      - 'modules/property-records/**'
      - 'workers/intake/**'
      - 'contact/**'
      - '.github/workflows/fltract-foundation-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run property-record and intake-contract tests
        run: node --test modules/property-records/tests/*.test.mjs
